title: Dra. Cláudia Cristina de Araújo
tagline: Anestesiologia
description: Informações claras sobre anestesia, preparo para o procedimento e contato com a Dra. Cláudia.
lang: pt-BR
url: https://medicau.github.io
baseurl: ""
# Protótipo: noindex em todas as páginas até o lançamento definitivo (ver CLAUDE.md).
noindex: true
# Faixa amarela de protótipo (_includes/aviso.html): removida a pedido do João em 11/11/2026; volte para true para exibir.
prototipo: false

collections:
  guias:
    output: true
    permalink: /preparo/:name/

defaults:
  - scope: {path: ""}
    values: {layout: page}
  - scope: {path: "", type: guias}
    values: {layout: guia}

markdown: kramdown
exclude:
  - docs
  - bin
  - privado
  - .claude
  - .githooks
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
