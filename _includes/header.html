<header class="topo">
  <div class="wrap topo-linha">
    <a class="marca" href="{{ '/' | relative_url }}"><span class="nome-longo">{{ site.data.medica.nome }}</span><span class="nome-curto" aria-hidden="true">{{ site.data.medica.nome_curto }}</span></a>
    <div class="acoes">
      {% for item in site.data.navegacao %}{% if item.topo %}<a class="link-topo" href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.titulo }}</a>{% endif %}{% endfor %}
      <a class="btn btn-sm" href="{{ '/agendar/' | relative_url }}">Consultas</a>
      <button type="button" class="tema" id="tema" data-modo="system" aria-label="Tema: sistema. Clique para mudar." title="Tema: sistema">
      <svg class="i-sistema" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      <svg class="i-claro" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-escuro" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
      <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </div>
  <nav class="wrap menu" id="menu" aria-label="Principal">
    <ul>
      {% for item in site.data.navegacao %}
      <li{% if item.topo %} class="so-menu-celular"{% endif %}><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.titulo }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
<script>
(function(){
  var b=document.getElementById("tema"),r=document.documentElement;
  var ordem=["system","light","dark"],nome={system:"sistema",light:"claro",dark:"escuro"};
  function atual(){var t=r.getAttribute("data-theme");return t==="light"||t==="dark"?t:"system"}
  function mostrar(m){b.setAttribute("data-modo",m);var n="Tema: "+nome[m];b.title=n;b.setAttribute("aria-label",n+". Clique para mudar.")}
  mostrar(atual());
  b.addEventListener("click",function(){
    var m=ordem[(ordem.indexOf(atual())+1)%3];
    if(m==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",m);
    try{if(m==="system")localStorage.removeItem("tema");else localStorage.setItem("tema",m)}catch(e){}
    mostrar(m);
  });
})();
(function(){
  var mb=document.getElementById("menu-btn"),m=document.getElementById("menu");
  mb.addEventListener("click",function(){
    var a=m.classList.toggle("aberto");mb.setAttribute("aria-expanded",a?"true":"false");
  });
})();
</script>
